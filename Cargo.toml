[package]
name = "diffmem"
version = "0.1.0"
edition = "2021"
authors = ["Abhinav Mahajan <abhinavmahajan91@gmail.com>"]
description = "Zero-touch episodic failure memory for coding agents"
repository = "https://github.com/abhinavm-web/diffmem"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
tempfile = "3.10"
glob = "0.3"
sha2 = "0.10"
blake3 = "1.5"
similar = "2.4"

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
all = "deny"
